name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sbt-dynver needs tags

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Compile core + components
        run: sbt -J-Xmx3g "core/compile" "components/compile"

      # Gates the WCAG AA contrast audit over every shipped Theme. lui owns both
      # halves of every pairing its components draw, so a token change that drops
      # one below AA can only be caught here.
      - name: Test core
        run: sbt -J-Xmx3g "core/test"

      - name: Compile demo (sanity check)
        run: sbt -J-Xmx3g "example/fastLinkJS" "devserver/compile"
